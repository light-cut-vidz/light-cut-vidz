name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Read-only by default; the jobs that publish ask for write access themselves.
permissions:
  contents: read

jobs:
  # A tag used to publish whatever it pointed at, tested or not.
  verify:
    name: Lint, type check and test
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install fonts (subtitle rendering tests)
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  create-release:
    name: Create GitHub Release
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The notes are the tag's section of CHANGELOG.md and CHANGELOG.fr.md. The
      # script fails when either has none: no release without notes in both languages.
      - name: Build release notes from the changelogs
        run: node scripts/release-notes.js "${{ github.ref_name }}" > release-notes.md

      - name: Create draft release
        run: |
          gh release create "${{ github.ref_name }}" \
            --draft \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-mac:
    name: Build macOS archive (arm64)
    needs: [create-release]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Sync version from tag
        run: |
          # `npm version` refuses when the version is unchanged and `|| true` hid
          # every other failure too; `pkg set` is idempotent and fails for real.
          npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          npm_config_arch: arm64

      - name: Check code signing availability
        id: csc
        run: echo "enabled=$( [ -n "$VAL" ] && echo true || echo false )" >> $GITHUB_OUTPUT
        env:
          VAL: ${{ secrets.CSC_LINK }}

      - name: Build app bundle (arm64)
        run: |
          # Signing variables are exported only when a certificate exists: an
          # *empty* CSC_LINK is read by electron-builder as a path ("not a file").
          EXTRA=""
          if [ -n "$SECRET_CSC_LINK" ]; then
            export CSC_LINK="$SECRET_CSC_LINK" CSC_KEY_PASSWORD="$SECRET_CSC_KEY_PASSWORD"
            # Notarize only when Apple credentials exist as well.
            if [ -n "$SECRET_APPLE_ID" ]; then
              export APPLE_ID="$SECRET_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$SECRET_APPLE_APP_SPECIFIC_PASSWORD" APPLE_TEAM_ID="$SECRET_APPLE_TEAM_ID"
              EXTRA="-c.mac.notarize=true"
            fi
          fi
          npm run vite:build && npx electron-builder --mac dir --arm64 --publish never $EXTRA
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.csc.outputs.enabled }}
          SECRET_CSC_LINK: ${{ secrets.CSC_LINK }}
          SECRET_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Ad-hoc sign app (no Apple Developer certificate)
        if: steps.csc.outputs.enabled == 'false'
        run: codesign --force --deep --sign - "dist-app/mac-arm64/LightCutVidz.app"

      # Une archive, pas une image disque : macOS s'installe uniquement par Homebrew,
      # et un cask sait dézipper une .app aussi bien que monter un DMG. Plus rien à
      # télécharger et glisser à la main.
      - name: Package the app (arm64)
        working-directory: dist-app/mac-arm64
        run: ditto -c -k --keepParent "LightCutVidz.app" "../LightCutVidz-mac-arm64.zip"

      - name: Upload archive to GitHub Release
        run: gh release upload "${{ github.ref_name }}" dist-app/LightCutVidz-mac-arm64.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-linux:
    name: Build Linux AppImage + deb
    needs: [create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Sync version from tag
        run: |
          # `npm version` refuses when the version is unchanged and `|| true` hid
          # every other failure too; `pkg set` is idempotent and fails for real.
          npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build AppImage and deb
        run: npm run vite:build && npx electron-builder --linux AppImage deb --publish never

      - name: Upload AppImage, deb, and update metadata to GitHub Release
        run: |
          gh release upload "${{ github.ref_name }}" dist-app/LightCutVidz-linux.AppImage --clobber
          gh release upload "${{ github.ref_name }}" dist-app/LightCutVidz-linux.deb --clobber
          gh release upload "${{ github.ref_name }}" dist-app/latest-linux.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: Publish GitHub Release
    needs: [release-mac, release-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # build provenance attestation
      attestations: write
    steps:
      # The in-app updater and install.sh refuse a download they cannot verify
      # against this file.
      - name: Publish SHA256SUMS
        run: |
          set -euo pipefail
          mkdir assets
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --dir assets \
            --pattern 'LightCutVidz-linux.AppImage' --pattern 'LightCutVidz-linux.deb' --pattern 'LightCutVidz-mac-arm64.zip'
          (cd assets && sha256sum LightCutVidz-linux.AppImage LightCutVidz-linux.deb LightCutVidz-mac-arm64.zip > SHA256SUMS && cat SHA256SUMS)
          gh release upload "${{ github.ref_name }}" assets/SHA256SUMS --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A signed statement, verifiable with `gh attestation verify <file> -R <repo>`,
      # that these exact files were built by this workflow from this tag. Unlike
      # SHA256SUMS it does not live next to the files it vouches for.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: assets/LightCutVidz-*

      - name: Mark release as latest
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
